# AIR-146 — Job nocturno de detección de drift repo↔n8n.
#
# Compara n8n/workflows/ (repo) contra el n8n vivo y ENTREGA el reporte a un
# humano. La detección lleva un mes funcionando (`scripts/check-n8n-repo-drift.mjs`);
# lo que faltaba era la entrega: el Step Summary de Actions no lo mira nadie.
#
# ENTREGA (fase 2): un ÚNICO issue de GitHub vivo, identificado por el label
# `n8n-drift`. Cada corrida ACTUALIZA su cuerpo con el reporte del día; solo
# COMENTA (que es lo que notifica) cuando el reporte CAMBIA respecto al que ya
# está publicado — así un drift estable no genera un comentario por noche. Si el
# drift desaparece (exit 0), el issue se cierra solo. Sin secrets nuevos: usa el
# GITHUB_TOKEN efímero del run.
#
# El job SIGUE FALLANDO (exit 1) cuando hay drift: la notificación no lo pone en
# verde. No es required check de branch protection, así que no bloquea PRs.
#
# INVARIANTE DEL CANAL DE AVISO: ningún dato del reporte —que viene de la API de
# n8n y por tanto lo controla quien edite un workflow— puede impedir que el aviso
# salga. Este archivo se escribe contra ese modelo de amenaza: un editor de n8n
# que NO quiere que sus cambios sin versionar se reporten. Las tres defensas:
#   1. Los backticks del reporte se NEUTRALIZAN (→ comilla simple) y los bytes NUL
#      se eliminan, así que toda valla de bloque de código es FIJA de 3 backticks
#      y su longitud no depende del atacante.
#   2. El cuerpo del issue tiene un TOPE DURO calculado: cabecera y cierre se
#      escriben primero y se MIDEN, y el reporte solo ocupa lo que sobra de
#      65536 (ver el cálculo en el paso de notificación).
#   3. Se COMENTA antes de publicar la huella nueva: si algo falla, la huella
#      publicada sigue siendo la vieja y mañana se vuelve a avisar.
#   4. El CUERPO MÍNIMO (sin un byte del reporte) se escribe ANTES de intentar el
#      cuerpo completo, y el armado del completo va aislado en un subshell: si
#      cualquier paso de ese armado falla, se avisa con menos detalle, nunca se
#      deja de avisar. Una red de seguridad colocada DESPUÉS del punto que puede
#      morir no es una red — así murió el `head -c | iconv -c` bajo `pipefail`.
#
# La señal `drift` del Sentinela (n8n/workflows/Sentinela_v1.json) se retiró: no
# era "redundante y peor", estaba MUERTA. Su nodo Code leía
# `$vars.SENTINELA_BASELINE` y hacía `if (!BASELINE) return out;` — el plan de n8n
# de esta cuenta NO incluye Variables, así que `$vars` era `undefined` y la señal
# no emitía nada desde el día uno, indistinguible de "todo OK". La lección es esa:
# un sensor con fallback silencioso es indistinguible de "todo OK".
#
# Secrets requeridos (configurar a mano en Settings → Secrets and variables →
# Actions):
#   - N8N_API_KEY   API key de n8n (solo lectura; el script únicamente hace GET)
#   - N8N_BASE_URL  URL base de la instancia n8n (con o sin /api/v1; se normaliza)
#                   p.ej. https://airedeagua.app.n8n.cloud

name: n8n-drift

on:
  schedule:
    # 11:00 UTC = 06:00 COT (America/Bogota, UTC-5). Nocturno.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

# Mínimo privilegio: lectura del repo + escritura de issues (crear/editar/comentar/
# cerrar el issue de drift y crear su label la primera vez). Nada más: ni
# `pull-requests`, ni `contents: write`, ni `actions`.
permissions:
  contents: read
  issues: write

# Dos corridas simultáneas (cron + dispatch manual) podrían crear dos issues a la
# vez. Se serializan; no se cancela la que ya corre (perdería la notificación).
concurrency:
  group: n8n-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check repo↔n8n drift
        id: check
        env:
          # El script lee N8N_API_URL; el secret se llama N8N_BASE_URL.
          N8N_API_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_URL" ] || [ -z "$N8N_API_KEY" ]; then
            echo "## n8n-drift: secrets no configurados" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Falta configurar \`N8N_BASE_URL\` y/o \`N8N_API_KEY\` en GitHub Secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "Ver docs/agentes/n8n-drift.md." >> "$GITHUB_STEP_SUMMARY"
            # status=2 (error de configuración, NO drift): el paso de notificación
            # lo ignora a propósito — no se toca el issue cuando el sensor no corrió.
            echo "status=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Capturar el reporte y el exit code sin que `set -e` aborte antes de
          # escribir el Step Summary. El script NO imprime secretos (solo
          # nombres/ids de workflow y tipos de drift), y redacta la URL de la
          # instancia de sus mensajes de error fatales.
          set +e
          node scripts/check-n8n-repo-drift.mjs > drift-report.raw 2>&1
          status=$?
          set -e

          # ---- NEUTRALIZACIÓN DEL DATO (una sola vez, aquí) -------------------
          # El reporte es texto derivado de datos externos: los nombres de nodo y
          # de workflow vienen de la API de n8n y no tienen límite de longitud ni
          # de contenido. Se le quitan al dato las dos capacidades que le permitían
          # romper el canal:
          #   - bytes NUL (`tr -d`): un NUL hacía que `grep` declarara "binary file
          #     matches" por stderr y devolviera stdout VACÍO, colapsando cualquier
          #     escaneo defensivo hecho con grep.
          #   - backticks (`tr` → comilla simple): a partir de aquí el reporte NO
          #     puede contener ``` , así que TODA valla de bloque de código (Step
          #     Summary e issue) es FIJA de 3 backticks. Antes la valla se calculaba
          #     como "racha más larga del dato + 1": ilimitada y atada al atacante.
          # Sustituir backtick por comilla simple preserva el largo en bytes, así
          # que ningún presupuesto de recorte se descuadra.
          tr -d '\000' < drift-report.raw | tr '`' "'" > drift-report.txt

          {
            echo '```'
            cat drift-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Eco también al log del job para inspección rápida.
          cat drift-report.txt
          # El job falla más abajo (paso "Fallar si hay drift"), DESPUÉS de notificar.
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Notificar drift (issue único con label n8n-drift)
        if: always() && (steps.check.outputs.status == '0' || steps.check.outputs.status == '1')
        env:
          GH_TOKEN: ${{ github.token }}
          # Todo lo que el script necesita entra por env, NUNCA por interpolación
          # `${{ }}` dentro de `run:` — y el REPORTE jamás toca la línea de comando:
          # viaja siempre como ARCHIVO (--body-file). El reporte es texto derivado
          # de datos externos (nombres de workflow que vienen de la API de n8n): un
          # nombre malicioso no puede convertirse en comando ni en markdown/HTML
          # arbitrario, porque va encerrado en un bloque de código de valla fija
          # sobre un dato al que ya se le quitaron los backticks.
          DRIFT_STATUS: ${{ steps.check.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: n8n-drift
          TITLE: 'n8n-drift: la instancia viva y n8n/workflows/ divergen'
          # Asignado explícito: sin él la entrega dependía de la config de watch del
          # repo (que nadie garantiza). Se aplica SIEMPRE en una llamada aparte y
          # fail-open — un login inválido devuelve 422 y mataría el paso, o sea
          # mataría el aviso, que es justo lo que este archivo protege.
          ASSIGNEE: sansua2025
        run: |
          set -euo pipefail

          # El label es la CLAVE del issue único (el título puede editarse a mano;
          # el label no se pierde). --force lo hace idempotente si ya existe.
          # Fail-open: si el label ya existe esto es un no-op, y un 5xx transitorio
          # aquí no debe costar el aviso de la noche. Si el label REALMENTE no
          # existiera, `gh issue create --label` fallaría después y el paso muere
          # ahí — no se pierde nada por no morir aquí.
          gh label create "$LABEL" --force \
            --color 'B60205' \
            --description 'Drift entre n8n/workflows/ (repo) y la instancia viva de n8n' >/dev/null \
            || echo "AVISO: no se pudo crear/actualizar el label $LABEL." >&2

          # TODOS los issues abiertos con el label, del más viejo al más nuevo.
          # Antes se tomaba `--limit 1` (el más reciente): si por lo que fuera
          # existían dos, el otro quedaba vivo para siempre sin que nadie lo tocara.
          gh issue list --label "$LABEL" --state open --limit 100 \
            --json number --jq '.[].number' | sort -n > open-issues.txt
          NUM="$(head -n 1 open-issues.txt)"

          # ---- sin drift: cerrar TODOS los issues vivos, y salir ---------------
          if [ "$DRIFT_STATUS" = "0" ]; then
            if [ -s open-issues.txt ]; then
              # `</dev/null` en cada gh: si leyera stdin se comería el resto del bucle.
              while read -r n; do
                [ -n "$n" ] || continue
                gh issue close "$n" --reason completed </dev/null \
                  --comment "Drift resuelto: la corrida de $(date -u +%F) no encontró divergencias entre \`n8n/workflows/\` y la instancia viva. Run: $RUN_URL"
                echo "Issue #$n cerrado (sin drift)."
              done < open-issues.txt
            else
              echo "Sin drift y sin issue abierto: nada que hacer."
            fi
            exit 0
          fi

          # ---- hay drift: armar el cuerpo -------------------------------------
          # Huella del reporte. Es lo que decide si se COMENTA (notifica) o solo se
          # actualiza el cuerpo en silencio: un drift estable no debe generar un
          # comentario por noche. Si `sha256sum` fallara, la huella cae a un valor
          # ÚNICO por corrida en vez de tumbar el paso: fail-open hacia AVISAR DE
          # MÁS (abajo se leerá como "el drift cambió" y se comentará).
          HASH="$( { sha256sum drift-report.txt || true; } | { grep -aoE '^[0-9a-f]{64}' || true; } | head -n 1)"
          if [ -z "$HASH" ]; then
            HASH="$(printf '%064x' "$(date -u +%s)")"
            echo "AVISO: no se pudo calcular la huella del reporte; se fuerza el comentario." >&2
          fi

          # ---- RED DE SEGURIDAD: PRIMERO, NO AL FINAL --------------------------
          # PRINCIPIO: una red de seguridad colocada DESPUÉS del punto que puede
          # morir no es una red. Este cuerpo mínimo no lleva un solo byte del
          # reporte —ningún dato externo participa en armarlo— y se escribe ANTES de
          # intentar el cuerpo completo. Desde aquí SIEMPRE hay un cuerpo válido que
          # enviar: el completo solo lo REEMPLAZA si se armó entero. El peor caso
          # deja de ser "no avisar" y pasa a ser "avisar con menos detalle".
          {
            printf '%s\n\n' 'Detección automática (`.github/workflows/n8n-drift.yml`): `n8n/workflows/` y la instancia viva de n8n **divergen**.'
            printf '%s\n\n' 'El reporte no pudo incluirse en el cuerpo de este issue; está completo en el log del run.'
            printf 'Run: %s\n' "$RUN_URL"
            printf '\n<!-- drift-hash: %s -->\n' "$HASH"
          } > issue-body.md

          # ---- cuerpo completo: TODO lo que puede fallar, AISLADO ---------------
          # El armado corre en un subshell con su propio `set -euo pipefail`, lanzado
          # FUERA de una condición: en bash un `if ( … )` o un `( … ) || x` DESACTIVA
          # el errexit de dentro (verificado en bash 5.2), así que el padre lo rodea
          # con `set +e` y solo lee el código de salida. Si algo de aquí dentro falla
          # —el recorte, un `wc`, un `printf`, el tope— el cuerpo mínimo sigue en pie
          # y el aviso sale igual.
          set +e
          (
            set -euo pipefail

            # Elimina del FINAL de $1 una secuencia UTF-8 incompleta (3 bytes como
            # mucho). Es aritmética de bytes sobre `od`: ninguna etapa puede fallar
            # por el corte. NO se usa `iconv -c`: `-c` omite caracteres inválidos EN
            # MEDIO del stream, pero una secuencia cortada AL FINAL —exactamente lo
            # que produce `head -c`— hace que glibc iconv SALGA 1 (verificado en
            # glibc 2.39, la de ubuntu-latest) y bajo `pipefail` eso mataba el paso
            # antes de avisar. El relleno que alinea el corte lo elige quien nombra
            # el nodo: era determinista, no azar. Y sin atacante muerde igual, porque
            # el propio reporte lleva `↔ · — ⚠ ≠ →`.
            trim_incomplete_utf8() {
              local f="$1" out n i cont lead need have size
              local -a b=()
              out="$( { tail -c 4 "$f" || true; } | od -An -v -tu1 | tr -s ' ' '\n' | sed '/^$/d')" || return 0
              [ -n "$out" ] || return 0
              mapfile -t b <<< "$out"
              n=${#b[@]}
              # Contar los bytes de continuación (0x80-0xBF) del final.
              cont=0
              i=$(( n - 1 ))
              while [ "$i" -ge 0 ] && [ "${b[$i]}" -ge 128 ] && [ "${b[$i]}" -le 191 ]; do
                cont=$(( cont + 1 )); i=$(( i - 1 ))
              done
              [ "$i" -ge 0 ] || return 0
              lead="${b[$i]}"
              if   [ "$lead" -ge 240 ]; then need=4
              elif [ "$lead" -ge 224 ]; then need=3
              elif [ "$lead" -ge 192 ]; then need=2
              else need=1
              fi
              have=$(( 1 + cont ))
              [ "$have" -lt "$need" ] || return 0   # el último carácter está completo
              size="$(wc -c < "$f")" || return 0
              head -c "$(( size - have ))" "$f" > "$f.tmp" || return 0
              mv "$f.tmp" "$f" || return 0
              return 0
            }

            # TOPE DURO DEL CUERPO. El cuerpo de un issue de GitHub tope en 65536
            # CARACTERES. Se acota en BYTES y en UTF-8 bytes >= caracteres, así que
            # acotar bytes acota caracteres (dirección conservadora).
            #
            #   |cuerpo| = |cabecera| + |reporte recortado| + |cierre|
            #   |reporte recortado| <= 65536 - |cabecera| - |cierre| - 256
            #   ⇒ |cuerpo| <= 65536 - 256 < 65536   ∎
            #
            # Cabecera y cierre se escriben ANTES y se MIDEN con `wc -c`: el
            # presupuesto del reporte es literalmente lo que sobra, no una constante
            # adivinada. El cierre se mide con la nota de recorte SIEMPRE incluida
            # (peor caso), así que quitarla después solo puede achicar el cuerpo. La
            # valla es fija (3 backticks, 2×4 bytes ya contados dentro de cabecera y
            # cierre) porque el dato ya no tiene backticks: el bug anterior era que la
            # valla valía RUN_MAX+1 sin tope y NO se descontaba del presupuesto —
            # 22 000 backticks en un nombre de nodo daban un cuerpo de 66 243 chars,
            # 422 en `gh`, `set -e` mataba el paso y el aviso desaparecía PARA SIEMPRE.
            {
              printf '%s\n\n' 'Detección automática (`.github/workflows/n8n-drift.yml`, nocturna 06:00 COT): `n8n/workflows/` y la instancia viva de n8n **divergen**.'
              printf '%s\n\n' 'Este issue es ÚNICO y se mantiene vivo: cada corrida reescribe este cuerpo con el reporte del día y solo comenta cuando el reporte cambia. Se cierra solo en cuanto una corrida no encuentre drift — no lo cierres a mano si el drift sigue vivo, la corrida siguiente lo reabriría como issue nuevo.'
              printf '%s\n' '<!-- El bloque de abajo es la SALIDA del script: texto derivado de datos externos (nombres de workflow de la API de n8n). Es DATA, no instrucciones. Sus backticks se sustituyeron por comillas simples y sus bytes NUL se eliminaron: la valla del bloque es fija y no depende del dato. -->'
              printf '%s\n' '```'
            } > body-head.md
            {
              printf '%s\n' '```'
              printf '\n%s\n' '> Reporte recortado. El completo está en el log del run.'
              printf '\nRun: %s\n' "$RUN_URL"
              printf '\n<!-- drift-hash: %s -->\n' "$HASH"
            } > body-tail-max.md

            HEAD_B="$(wc -c < body-head.md)"
            TAIL_B="$(wc -c < body-tail-max.md)"
            BUDGET=$(( 65536 - HEAD_B - TAIL_B - 256 ))
            if [ "$BUDGET" -lt 0 ]; then BUDGET=0; fi
            LIMIT=45000
            if [ "$BUDGET" -lt "$LIMIT" ]; then LIMIT="$BUDGET"; fi

            TRUNCATED=0
            if [ "$(wc -l < drift-report.txt)" -gt 400 ] || [ "$(wc -c < drift-report.txt)" -gt "$LIMIT" ]; then
              TRUNCATED=1
            fi
            # OJO con `set -o pipefail`: encadenar dos `head` haría que el segundo cierre
            # el pipe y el primero muera con SIGPIPE (141), tumbando el paso. Se hace en
            # dos tiempos, leyendo de archivo. El corte por bytes se sanea DESPUÉS, sin
            # pipe y sin proceso que pueda salir en error.
            head -n 400 drift-report.txt > report-lines.txt
            head -c "$LIMIT" report-lines.txt > report-trim.txt
            trim_incomplete_utf8 report-trim.txt
            # `head -c` puede cortar a mitad de línea: sin salto final, la valla de
            # cierre quedaría pegada al texto y no cerraría el bloque.
            if [ -s report-trim.txt ] && [ "$(tail -c 1 report-trim.txt | wc -l)" -eq 0 ]; then
              printf '\n' >> report-trim.txt
            fi

            {
              printf '%s\n' '```'
              if [ "$TRUNCATED" = "1" ]; then
                printf '\n%s\n' '> Reporte recortado. El completo está en el log del run.'
              fi
              printf '\nRun: %s\n' "$RUN_URL"
              printf '\n<!-- drift-hash: %s -->\n' "$HASH"
            } > body-tail.md

            # El reporte se CONCATENA como archivo (cat), nunca se expande en la línea
            # de comando ni se pasa por `echo "$var"`.
            cat body-head.md report-trim.txt body-tail.md > body-full.md

            # Comprobación del tope. NO es código muerto aunque sea inalcanzable: lo
            # es solo mientras el cálculo de arriba sea correcto, y lo es porque
            # cabecera y cierre son CONSTANTES DE ESTE ARCHIVO (los `printf` de aquí
            # arriba) medidas con `wc -c`, no valores del dato. Si alguien tocara esos
            # textos y el presupuesto se descuadrara, salir por aquí degrada al cuerpo
            # mínimo —que ya está escrito— en vez de mandar un cuerpo que `gh`
            # rechazaría con 422, matando el aviso.
            if [ "$(wc -c < body-full.md)" -gt 65536 ]; then
              echo "AVISO: el cuerpo completo superó el tope de 65536." >&2
              exit 1
            fi
          )
          BODY_RC=$?
          set -e
          if [ "$BODY_RC" -eq 0 ] && [ -s body-full.md ]; then
            mv body-full.md issue-body.md
          else
            echo "AVISO: no se pudo armar el cuerpo completo (rc=$BODY_RC); se envía el cuerpo mínimo, sin el reporte." >&2
          fi

          # ---- crear ----------------------------------------------------------
          if [ -z "$NUM" ]; then
            URL="$(gh issue create --title "$TITLE" --label "$LABEL" --body-file issue-body.md)"
            echo "Issue de drift creado: $URL"
            NEW="${URL##*/}"
            case "$NEW" in
              ''|*[!0-9]*) echo "No se pudo extraer el número del issue; queda sin asignar." ;;
              *) gh issue edit "$NEW" --add-assignee "$ASSIGNEE" >/dev/null \
                   || echo "AVISO: no se pudo asignar a $ASSIGNEE (el issue queda creado)." ;;
            esac
            exit 0
          fi

          # Duplicados: el CANÓNICO es el más viejo (es el que acumula la discusión
          # humana); los demás se cierran apuntando a él en vez de quedar huérfanos.
          if [ "$(wc -l < open-issues.txt)" -gt 1 ]; then
            tail -n +2 open-issues.txt > extra-issues.txt
            while read -r n; do
              [ -n "$n" ] || continue
              # El echo de éxito va en el camino feliz: colgado del `||` de arriba,
              # un cierre fallido imprimía el AVISO **y** "cerrado" en el mismo log.
              if gh issue close "$n" --reason "not planned" </dev/null \
                   --comment "Duplicado: el issue vivo de drift es #$NUM. Run: $RUN_URL"; then
                echo "Issue duplicado #$n cerrado (canónico: #$NUM)."
              else
                echo "AVISO: no se pudo cerrar el duplicado #$n (queda abierto; el canónico sigue siendo #$NUM)."
              fi
            done < extra-issues.txt
          fi

          # Huella publicada en el issue. El cuerpo es texto editable por humanos y
          # además contiene el reporte: se ancla al COMENTARIO HTML COMPLETO y se
          # toma la ÚLTIMA coincidencia. Con `head -n 1` ganaba un nombre de workflow
          # hostil que contuviera "drift-hash: <64 hex>", porque el bloque de datos
          # va ANTES del marcador real (que es siempre lo último del cuerpo).
          # Fail-open: es una LECTURA. Si falla, `old-body.md` queda vacío, OLD_HASH
          # sale vacío y el paso siguiente lee "el drift cambió" -> COMENTA. La
          # dirección segura del fallo es avisar de más, nunca callar.
          gh issue view "$NUM" --json body --jq '.body' > old-body.md \
            || { : > old-body.md; echo "AVISO: no se pudo leer el cuerpo de #$NUM; se comentará por si acaso." >&2; }
          OLD_HASH="$({ grep -aoE '<!-- drift-hash: [0-9a-f]{64} -->' old-body.md || true; } | tail -n 1 | grep -aoE '[0-9a-f]{64}' || true)"

          # ---- notificar ANTES de publicar la huella nueva ---------------------
          # ORDEN CRÍTICO: comentar primero, editar el cuerpo después. Al revés (el
          # orden anterior), si el comentario fallaba —rate-limit, 5xx, abuse
          # detection— `set -e` abortaba con el hash NUEVO ya publicado en el cuerpo:
          # la corrida siguiente leía OLD_HASH == HASH y NO comentaba, así que ese
          # cambio de drift no se notificaba NUNCA MÁS. Con este orden, si algo falla
          # la huella publicada sigue siendo la vieja y mañana se vuelve a comentar
          # (duplicado benigno). La dirección segura del fallo es "notificar de más".
          if [ "$HASH" = "${OLD_HASH:-}" ]; then
            gh issue edit "$NUM" --body-file issue-body.md >/dev/null
            echo "Issue #$NUM actualizado; el drift no cambió -> sin comentario (anti-spam)."
          else
            printf 'El reporte de drift **cambió** respecto a la corrida anterior. El cuerpo del issue ya tiene la versión al día.\n\nRun: %s\n' "$RUN_URL" > comment.md
            gh issue comment "$NUM" --body-file comment.md >/dev/null
            gh issue edit "$NUM" --body-file issue-body.md >/dev/null
            echo "Issue #$NUM comentado y actualizado (el drift cambió)."
          fi

          # Asignado explícito, idempotente y fail-open (ver ASSIGNEE arriba).
          gh issue edit "$NUM" --add-assignee "$ASSIGNEE" >/dev/null \
            || echo "AVISO: no se pudo asignar a $ASSIGNEE (el aviso ya salió)."

      - name: Fallar si hay drift
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: exit "${STATUS:-2}"
