# AIR-162 — Job semanal de detección de drift git↔PROD de migraciones de Supabase.
#
# Recolecta de forma determinista (scripts/agent/migration-drift-collect.sh) lo
# aplicado en PROD (vnctmzsgemefgbtjctlo) y los archivos versionados en
# supabase/migrations/, y los reconcilia con un analizador 100% DETERMINISTA
# (scripts/agent/migration-drift-analyze.sh) — sin LLM, sin la claude-code-action
# que se colgaba (>25 min) en contexto schedule/workflow_dispatch.
#
# El baseline scripts/agent/migration-drift-baseline.txt bendice el estado
# reconciliado actual (convención AIR-90: nombres tempranos sin prefijo NNN_,
# renumeraciones vía git mv). El analizador normaliza los slugs de git y PROD,
# calcula la diferencia simétrica y resta el baseline: el job solo FALLA ante
# divergencias NUEVAS que no estén bendecidas. Para re-bendecir tras una
# reconciliación intencional, regenerar el baseline.
#
# Informativo: si hay drift nuevo el job FALLA (visible en la pestaña Actions),
# pero NO es un required check de branch protection y por tanto no bloquea PRs.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   - SUPABASE_DB_URL  connection string Postgres (idealmente read-only)
#                      hacia vnctmzsgemefgbtjctlo.
#
# TODO (fase 2): cablear notificación a Linear/Slack cuando haya drift en lugar
# de solo fallar el job. Por ahora la señal vive en Actions + el Step Summary.

name: migration-drift

on:
  schedule:
    # 12:23 UTC = 07:23 COT (America/Bogota, UTC-5). Lunes. Minuto off de :00
    # para no coincidir con otros crons.
    - cron: '23 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect drift data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            { echo "## migration-drift: secret no configurado"; echo; echo "Falta \`SUPABASE_DB_URL\` en GitHub Secrets. Job inerte hasta configurarlo."; } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          bash scripts/agent/migration-drift-collect.sh > /tmp/drift_data.txt
          echo "Collected $(wc -l < /tmp/drift_data.txt) lines."

      - name: Analyze drift
        run: |
          set -euo pipefail
          bash scripts/agent/migration-drift-analyze.sh /tmp/drift_data.txt | tee -a "$GITHUB_STEP_SUMMARY"
