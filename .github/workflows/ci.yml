# CI — hace real la condición 1 del merge-gate ("CI verde").
# Dos checks que branch protection debe exigir: "data-rules" y "dashboard".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  data-rules:
    name: data-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Self-test del linter (carve-out AIR-161 no debilita la detección)
        run: bash scripts/agent/check-data-rules.selftest.sh
      - name: Reglas críticas de datos sobre el diff
        run: |
          git fetch origin main --quiet || true
          bash scripts/agent/check-data-rules.sh --diff origin/main

  docstring-rpc-loop:
    name: docstring-rpc-loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # AIR-135 — drift docstring↔cuerpo en las RPCs del loop de insights.
      # Origen: AIR-97 (penalización 'refutado -0.15' documentada pero nunca implementada).
      # AIR-257 — self-test: el endurecimiento (decimal == delta solo con operador de
      # ajuste) NO debilita la detección AIR-97 y elimina el falso positivo por decimal
      # narrativo (AIR-242, "score 1.01").
      - name: Self-test del linter (endurecimiento AIR-257 no debilita AIR-97)
        run: bash scripts/agent/check-docstring-rpc-loop.selftest.sh
      - name: Drift docstring↔cuerpo en RPCs del loop sobre el diff
        run: |
          git fetch origin main --quiet || true
          bash scripts/agent/check-docstring-rpc-loop.sh --diff origin/main

  security-surface:
    name: security-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # AIR-232 (Parte A) — superficie de seguridad de migraciones. Gradúa a gate
      # determinista las 3 lecciones vivas de la auditoría de seguridad:
      #   S1 SECURITY DEFINER sin REVOKE ... FROM PUBLIC (AIR-231: revocar solo de
      #      anon/authenticated es NO-OP mientras PUBLIC conserve el grant).
      #   S2 CREATE TABLE public.* sin ENABLE ROW LEVEL SECURITY (AIR-203 / mig 006).
      #   S3 CREATE [MATERIALIZED] VIEW public.* sin security_invoker = true (AIR-203 / AIR-87).
      #   S4 SECURITY DEFINER sin SET search_path explícito.
      # El self-test prueba +/- de las 4 reglas + el caso PUBLIC + el salto por allowlist.
      - name: Self-test del check de superficie de seguridad
        run: bash scripts/agent/check-security-surface.selftest.sh
      - name: Superficie de seguridad sobre el diff de migraciones
        run: |
          git fetch origin main --quiet || true
          bash scripts/agent/check-security-surface.sh --diff origin/main

  hooks-guards:
    name: hooks-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # AIR-162 — self-tests de los hooks PreToolUse. Hasta ahora NINGÚN job los
      # corría: por eso la regresión del literal `mcp__supabase__*` (guard que
      # falla ABIERTO ante el prefijo con UUID del entorno remoto) sobrevivió
      # semanas en silencio. Un self-test que nadie ejecuta no es un gate.
      #   - guard-prod-writes: confirmación humana ante writes/DDL a PROD.
      #   - guard-verify-readonly: el rol verify no escribe.
      #   - guard-readonly-agents (AIR-285): los agentes de rol read-only no
      #     escriben en Supabase con NINGÚN prefijo MCP. Va aquí por el mismo
      #     motivo del comentario de arriba: es justo el tipo de guard que falla
      #     ABIERTO en silencio si nadie ejercita sus casos de prefijo.
      # Los tres usan jq, presente por defecto en ubuntu-latest; guard-prod-writes
      # además ejercita su propio fallback SIN jq (PATH mínimo).
      - name: Guard de writes a PROD (self-test)
        run: bash scripts/agent/hooks/guard-prod-writes.test.sh
      - name: Guard de verify read-only (self-test)
        run: bash scripts/agent/hooks/guard-verify-readonly.test.sh
      - name: Guard de agentes read-only (self-test)
        run: bash scripts/agent/hooks/guard-readonly-agents.test.sh

  n8n-sync:
    name: n8n-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # AIR-95 — guard de duplicación vigilada: el bloque de mapeo de
      # "Transform Ads Data" debe ser idéntico en Backfill y Daily_Sync.
      - name: Transform Ads Data en sync (Backfill ↔ Daily)
        run: bash scripts/check-transform-ads-sync.sh

  n8n-graph-parity:
    name: n8n-graph-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # AIR-140 — paridad nodes ↔ activeVersion.nodes: los nodos críticos de
      # seguridad (Build Prompt*, Claude*, Anthropic*, Parse Claude*) deben ser
      # idénticos en ambas copias del grafo. n8n EJECUTA activeVersion.nodes; si
      # diverge de w.nodes, una protección anti prompt-injection puede quedar en
      # la copia editada pero no en la que corre (regresión silenciosa).
      - name: Paridad de nodos críticos (nodes ↔ activeVersion.nodes)
        run: bash scripts/agent/check-n8n-graph-parity.sh

  prompt-hygiene:
    name: prompt-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Patrón AIR-94 (defensa anti prompt-injection en nodos que mandan texto a
      # Claude) + AIR-140 (recorrer AMBAS copias del grafo: n8n ejecuta
      # activeVersion.nodes). Auditoría 2026-07-01: se graduó a gate determinista.
      # Exige, por nodo crítico: sanitize() con strip total <[^>]*> en bloques
      # <data>, system defensivo con "Ignora", y sin el antipatrón "reporta lo
      # sospechoso". La deuda histórica vive en prompt-hygiene-allowlist.txt
      # (ratchet: solo bloquea regresiones nuevas).
      - name: Self-test del check de higiene de prompts
        run: bash scripts/agent/check-prompt-hygiene.selftest.sh
      - name: Higiene de prompts a Claude en workflows n8n
        run: bash scripts/agent/check-prompt-hygiene.sh

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (vitest)
        run: npm run test -- --passWithNoTests
      # 'next build' se queda en verify/Vercel: requiere envs de Supabase.

  evals:
    name: evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    # AIR-156 — Eval set del Cerebro (Fase B I6): reconcilia cada RPC gobernada
    # analytics.* contra un recompute canonico (analytics.eval_recompute) y contra
    # los seeds de public.golden_queries. Gate determinista >=95% (reconcile.test.ts
    # falla la suite si passed/total < 0.95). A diferencia del job 'dashboard', aqui
    # NO se usa --passWithNoTests: un eval rojo (o ausente) bloquea el merge.
    #
    # SECRETO REQUERIDO (configurar A MANO una sola vez en GitHub):
    #   Settings -> Secrets and variables -> Actions -> New repository secret
    #     - SUPABASE_SERVICE_ROLE_KEY  (rol service_role del proyecto vnctmzsgemefgbtjctlo)
    #   NEXT_PUBLIC_SUPABASE_URL es publica y se fija inline abajo.
    # Sin el secreto, reconcile.test.ts hace SKIP (no rompe); para que el gate sea
    # real el secreto DEBE estar presente. Marcar este job como required en branch
    # protection junto con 'data-rules' y 'dashboard'.
    #
    # PRE-REQUISITO DE DATOS: las migraciones 085 (GRANT EXECUTE a service_role) y
    # 086 (analytics.eval_recompute) deben estar aplicadas en prod. Santiago las
    # aplica al mergear; hasta entonces reconcile fallaria por permiso/funcion ausente.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Eval set del Cerebro (gate >=95%)
        env:
          EVALS_REQUIRED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://vnctmzsgemefgbtjctlo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test -- evals/

  migration-apply:
    name: migration-apply
    runs-on: ubuntu-latest
    # AIR-276 — Validación POR EJECUCIÓN de las migraciones nuevas del PR.
    #
    # POR QUÉ EXISTE. El check `Supabase Preview` de la integración de Supabase no
    # puede pasar NUNCA en este repo: levanta un preview branch VACÍO y reproduce
    # supabase/migrations/ desde cero, pero ese directorio es RESPALDO de lo
    # aplicado en PROD, no un bootstrap — ninguna migración crea las tablas base,
    # así que muere en el archivo 1 de 151 con `relation "venta_items" does not
    # exist`. Y cuando el cupo de preview branches concurrentes se agota, el check
    # se SALTA en silencio (incidente documentado en AIR-162). Entre las dos cosas,
    # ninguna migración de este repo estuvo nunca validada por ejecución antes de
    # entrar a producción.
    #
    # QUÉ HACE DISTINTO. En vez de reconstruir la historia desde cero, parte del
    # esquema ACTUAL de PROD (pg_dump --schema-only, solo lectura) y aplica encima
    # SOLO las migraciones que el PR AGREGA. Es la pregunta que de verdad importa:
    # "¿esto aplica sobre lo que hay en producción?".
    #
    # NUNCA PASA EN SILENCIO. Si falta el secreto, si el volcado sale vacío o si el
    # baseline no carga, el job FALLA. Un gate que se salta a sí mismo es la
    # patología que este job viene a cerrar. (Contrástese con `evals`, que hace SKIP
    # sin secreto — ahí el riesgo se asumió a propósito; aquí no.)
    #
    # SECRETO REQUERIDO: SUPABASE_DB_URL (el mismo que ya usa migration-drift).
    # Basta un rol de SOLO LECTURA: el job únicamente hace pg_dump --schema-only.
    #
    # PENDIENTE DE CONFIGURACIÓN MANUAL (Settings → Branches → branch protection):
    # marcar `migration-apply` como required check, y quitar de required a
    # `Supabase Preview`. Mientras la integración de preview branches siga activa
    # seguirá pintando rojo permanente sin aportar señal; conviene desactivarla en
    # Project Integrations Settings de Supabase (además ahorra ~US$0,0134/hora).
    services:
      pg:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # pg_dump debe ser >= al servidor (PROD es PostgreSQL 17.6) y el runner trae 16.
      # OJO: NO basta con instalar el paquete y confiar en el PATH. En Debian/Ubuntu
      # los binarios de /usr/bin son wrappers de postgresql-common resueltos por
      # update-alternatives, y con las dos versiones instaladas la resolución es
      # ASIMÉTRICA: `psql` salía 17.11 mientras `pg_dump` seguía saliendo 16.15,
      # y pg_dump aborta con "server version mismatch". Se usan rutas ABSOLUTAS.
      - name: Instalar cliente de PostgreSQL 17
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "PGBIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      # La versión se AFIRMA, no se imprime y se espera que alguien la mire: es
      # exactamente el fallo que se acaba de corregir.
      - name: Verificar que el cliente sea 17
        run: |
          set -euo pipefail
          for b in pg_dump psql; do
            v="$("$PGBIN/$b" --version | grep -oE '[0-9]+' | head -1)"
            echo "$b -> $v"
            [ "$v" -ge 17 ] || { echo "::error::$b es $v, se requiere >= 17 (PROD es 17.6)"; exit 1; }
          done

      # Prueba las DOS direcciones del gate antes de confiar en su veredicto:
      # que falla ante una migración rota (incluido el caso literal de AIR-276) y
      # que falla —en vez de pasar— cuando no puede verificar.
      - name: Self-test del gate de migraciones
        env:
          SELFTEST_DB_URL_TEMPLATE: postgresql://postgres:postgres@localhost:5432/{db}
        run: PSQL_BIN="$PGBIN/psql" bash scripts/agent/migration-gate.selftest.sh

      # El baseline vive en el repo y NO se vuelca aquí. Motivo: pg_dump bloquea
      # en ACCESS SHARE todas las tablas incluso con --schema-only, así que
      # exigiría pg_read_all_data sobre el rol del secret — y `ci_drift_reader`
      # (migración 104) se creó DELIBERADAMENTE "sin acceso a ningún dato de
      # negocio". Dárselo abriría la PII que AIR-203 endureció. Con el baseline
      # versionado, CI valida migraciones sin poder leer un solo dato de negocio.
      - name: Comprobar que el baseline existe
        run: |
          set -euo pipefail
          if [ ! -s supabase/baseline/schema.sql ]; then
            {
              echo "## migration-apply: falta el baseline del esquema"
              echo
              echo 'No existe `supabase/baseline/schema.sql`, así que el gate no puede'
              echo 'afirmar que la migración aplica: **falla** en vez de pasar.'
              echo
              echo 'Regenerarlo con una conexión privilegiada (no la de CI) y commitear:'
              echo '```'
              echo 'bash scripts/agent/migration-baseline-refresh.sh "<URL_PRIVILEGIADA>"'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::falta supabase/baseline/schema.sql; ver el resumen del job"
            exit 1
          fi
          echo "baseline: $(wc -l < supabase/baseline/schema.sql) líneas, $(grep -c . supabase/baseline/PROD_MIGRATIONS) migraciones registradas"

      # Un baseline viejo es el ÚNICO modo en que este gate podría dar un falso
      # verde (p.ej. PROD ya tiene una tabla que la migración crea). Se cierra
      # comparando las migraciones aplicadas en PROD contra las registradas al
      # volcar — y eso solo necesita SELECT sobre supabase_migrations.schema_migrations,
      # que es exactamente el único privilegio que ci_drift_reader ya tiene.
      - name: Verificar que el baseline no se quedó viejo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::falta SUPABASE_DB_URL; sin él no se puede comprobar la frescura del baseline"
            exit 1
          fi
          "$PGBIN/psql" "$SUPABASE_DB_URL" -tAc \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            > /tmp/prod_migrations.txt
          NUEVAS="$(comm -23 <(sort -u /tmp/prod_migrations.txt) <(sort -u supabase/baseline/PROD_MIGRATIONS) | grep -c . || true)"
          if [ "$NUEVAS" -gt 0 ]; then
            {
              echo "## migration-apply: el baseline se quedó viejo"
              echo
              echo "PROD tiene **$NUEVAS** migración(es) que no estaban aplicadas cuando se volcó"
              echo 'el baseline, así que validar contra él podría dar un falso verde.'
              echo
              comm -23 <(sort -u /tmp/prod_migrations.txt) <(sort -u supabase/baseline/PROD_MIGRATIONS) | sed 's/^/  - /'
              echo
              echo 'Regenerar y commitear:'
              echo '```'
              echo 'bash scripts/agent/migration-baseline-refresh.sh "<URL_PRIVILEGIADA>"'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::baseline desactualizado respecto de PROD; ver el resumen del job"
            exit 1
          fi
          echo "baseline al día con PROD."

      - name: Aplicar las migraciones nuevas sobre el esquema de PROD
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          "$PGBIN/psql" "postgresql://postgres:postgres@localhost:5432/postgres" -q \
            -c "CREATE DATABASE migration_gate"
          git fetch origin main --quiet || true
          PSQL_BIN="$PGBIN/psql" bash scripts/agent/migration-gate.sh \
            --target "postgresql://postgres:postgres@localhost:5432/migration_gate" \
            --baseline supabase/baseline/schema.sql \
            --base-ref origin/main | tee -a "$GITHUB_STEP_SUMMARY"
